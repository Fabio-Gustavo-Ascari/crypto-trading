[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-harness"
version = "0.1.0"
description = "A governed crypto-research and paper-trading harness."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "ta-patterns>=1.2.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
crypto-harness = "crypto_harness.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"

[tool.setuptools.packages.find]
where = ["src"]
